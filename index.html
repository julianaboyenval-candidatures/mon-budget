<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcf4f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f161b">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">

<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.login { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)); }
.loginform { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
.loginform h1 { margin: 0 0 6px; font-size: 28px; font-weight: 900; text-align: center; }
</style>
<title>Mon Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Mise en page : une colonne façon appli de téléphone, barre d'onglets en bas, gros bouton + toujours à portée de pouce. */
:root {
  --bg: #fcf4f7; --surface: #ffffff; --ink: #3a2630; --muted: #7a5c68; --line: #f1dfe6; --soft: #fbe9f1;
  --accent: #c93f7f; --on-accent: #ffffff;
  --good: #1b7f58; --warn: #a65f00; --bad: #c2302b;
  --c-fixes: #dd6a2e; --c-carburant: #1c9bc2; --c-courses: #c42b6e; --c-tca: #b98d00; --c-autres: #5e3fb5;
  --font: "Nunito", ui-rounded, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f161b; --surface: #2a1f26; --ink: #f8ecf1; --muted: #c0a5b1; --line: #43323b; --soft: #3a2a32;
  --accent: #ee75a9; --on-accent: #2a1020;
  --good: #57c79a; --warn: #e6a94d; --bad: #f0807a;
  --c-fixes: #d87338; --c-carburant: #259dc0; --c-courses: #e0558f; --c-tca: #bb9410; --c-autres: #9378e3;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1f161b; --surface: #2a1f26; --ink: #f8ecf1; --muted: #c0a5b1; --line: #43323b; --soft: #3a2a32;
  --accent: #ee75a9; --on-accent: #2a1020;
  --good: #57c79a; --warn: #e6a94d; --bad: #f0807a;
  --c-fixes: #d87338; --c-carburant: #259dc0; --c-courses: #e0558f; --c-tca: #bb9410; --c-autres: #9378e3;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 110px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 4px; padding-block: 10px; }
.top h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 800; text-align: center; text-transform: capitalize; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.iconbtn:disabled { opacity: .25; cursor: default; }
.iconbtn svg { width: 22px; height: 22px; }
.notice { font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; }

main { display: flex; flex-direction: column; gap: 22px; }
h2 { font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.panel { background: var(--surface); border-radius: 20px; padding: 4px 16px; }
.small { font-size: 13px; color: var(--muted); }

.hero { padding-block: 6px 2px; text-align: center; }
.hero .lab { font-size: 14px; font-weight: 700; color: var(--muted); }
.hero .val { font-size: 52px; line-height: 1.1; font-weight: 900; letter-spacing: -.02em; }
.hero .val.neg { color: var(--bad); }
.hero .eq { font-size: 14px; color: var(--muted); margin-top: 4px; }

.row { display: block; width: 100%; padding-block: 13px; border-bottom: 1px solid var(--line); }
.panel > .row:last-child, .panel > div:last-child > .row:last-child { border-bottom: 0; }
.rowhead { display: flex; align-items: baseline; gap: 8px; }
.rowhead .name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.rowhead .amt { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rowhead .of { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex: none; }
.meter { position: relative; height: 10px; border-radius: 5px; margin-top: 8px; background: var(--line); background: color-mix(in srgb, var(--c) 18%, var(--surface)); }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--c); }
.meter.over i { background: var(--bad); }
.meter u { position: absolute; top: 0; bottom: 0; background: var(--c); opacity: .45; text-decoration: none; }
.item .mini { flex: none; }
.itemrow { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.itemrow .item { border-bottom: 0; flex: 1; min-width: 0; }
.panel > .itemrow:last-child { border-bottom: 0; }
.meter b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.status { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 800; border-radius: 99px; padding: 1px 8px; white-space: nowrap; background: var(--soft); color: var(--muted); }
.pill.over { color: var(--bad); } .pill.warn { color: var(--warn); } .pill.ok { color: var(--good); }

.item { display: flex; align-items: center; gap: 10px; width: 100%; padding-block: 12px; border-bottom: 1px solid var(--line); min-height: 52px; }
.panel > .item:last-child { border-bottom: 0; }
.item .t { flex: 1; min-width: 0; }
.item .n { font-weight: 700; overflow-wrap: anywhere; }
.item .d { font-size: 13px; color: var(--muted); }
.item .a { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item .a.none { font-weight: 600; font-size: 13px; color: var(--muted); }
.grouphead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.grouphead h2 { margin: 0; color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 16px; display: flex; align-items: center; }
.grouphead span.tot { font-weight: 800; font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 18px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 7px 14px; border-radius: 99px; background: var(--surface); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip .dot { margin-right: 6px; }
.seg { display: flex; background: var(--soft); border-radius: 99px; padding: 3px; }
.seg button { flex: 1; text-align: center; padding: 7px 8px; border-radius: 99px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }

.chart { background: var(--surface); border-radius: 20px; padding: 14px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart svg text { font-family: var(--font); fill: var(--muted); }
.chart svg text.v { fill: var(--ink); font-weight: 800; }
.charttot { text-align: center; margin-bottom: 4px; }
.charttot strong { display: block; font-size: 30px; font-weight: 900; line-height: 1.15; }
.slice { cursor: pointer; transition: opacity .15s; }
.slice.dim { opacity: .3; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; }
.legend .dot { margin-right: 5px; }
.legend .key { display: inline-block; width: 14px; height: 2px; background: var(--ink); margin-right: 5px; }
.readout { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
.readout .h { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; text-transform: capitalize; }
.readout .l { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
.readout .l span:first-child { display: inline-flex; align-items: center; }
.tablewrap { overflow-x: auto; background: var(--surface); border-radius: 20px; padding: 6px 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { font-size: 12px; color: var(--muted); font-weight: 800; text-align: right; padding: 8px 0 8px 10px; }
th:first-child, td:first-child { text-align: left; padding-left: 0; text-transform: capitalize; }
td { text-align: right; padding: 9px 0 9px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
td em { display: block; font-style: normal; color: var(--muted); font-size: 12px; }
td.neg { color: var(--bad); font-weight: 800; }

.btn { display: block; width: 100%; text-align: center; font-weight: 800; padding: 13px; border-radius: 16px; background: var(--accent); color: var(--on-accent); }
.btn.alt { background: var(--soft); color: var(--ink); }
.btn.danger { background: none; color: var(--bad); }
.btn.danger.sure { background: var(--bad); color: var(--surface); }
.link { color: var(--accent); font-weight: 800; font-size: 14px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { padding: 8px 2px 7px; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs svg { width: 24px; height: 24px; }
.fab { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 62px; height: 62px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); }
.fab svg { width: 30px; height: 30px; }

.backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(40, 15, 30, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 24px 24px 0 0; padding-block: 14px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheethead { display: flex; align-items: center; justify-content: space-between; }
.sheethead h3 { margin: 0; font-size: 18px; font-weight: 800; }
.moneybig { display: flex; align-items: baseline; justify-content: center; gap: 4px; background: var(--surface); border-radius: 18px; padding: 8px 14px; }
.moneybig input { width: 100%; min-width: 0; text-align: right; font-size: 42px; font-weight: 900; border: 0; background: none; outline: 0; }
.moneybig span { font-size: 30px; font-weight: 900; color: var(--muted); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.inp { width: 100%; min-width: 0; font-size: 16px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.err { color: var(--bad); font-size: 14px; font-weight: 700; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
.wrapchips .chip { border: 1px solid var(--line); }
.formrow { display: grid; grid-template-columns: minmax(0, 1fr) 92px 34px; gap: 6px; align-items: center; margin-bottom: 6px; }
.formrow.fix { grid-template-columns: minmax(0, 1fr) 84px 54px 34px; }
.formrow .x { width: 34px; height: 34px; border-radius: 50%; text-align: center; color: var(--muted); font-size: 20px; line-height: 1; }
.colhead { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.minis { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.mini { min-height: 34px; padding: 5px 11px; border-radius: 99px; background: var(--soft); font-size: 13px; font-weight: 700; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: min(92vw, 420px); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 11px 14px; font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; gap: 12px; }
.toast button { font-weight: 900; text-decoration: underline; color: inherit; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script src="config.js"></script>
<script src="backend.js"></script>
</head>
<body>

<div class="app">
  <header class="top">
    <button class="iconbtn" id="prev" data-act="prev" aria-label="Mois précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="title">Mon budget</h1>
    <button class="iconbtn" id="next" data-act="next" aria-label="Mois suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="iconbtn" data-act="settings" aria-label="Revenus, budgets et charges fixes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
  </header>
  <div id="notice"></div>
  <main id="main"><p class="small" style="text-align:center">Chargement de ton budget…</p></main>
</div>

<button class="fab" data-act="add" aria-label="Ajouter une dépense"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" aria-label="Onglets"><div id="tabs"></div></nav>
<div id="sheet"></div>
<div id="toast" aria-live="polite"></div>

<script>
"use strict";
/* ---------- Catégories : mêmes postes que le tableau de budget ---------- */
const CATS = [
  { id: "fixes", label: "Dépenses fixes", short: "Fixes" },
  { id: "carburant", label: "Carburant", short: "Carburant" },
  { id: "courses", label: "Courses", short: "Courses" },
  { id: "tca", label: "TCA / Frais pro", short: "Frais pro" },
  { id: "autres", label: "Dépenses libres", short: "Libres" }
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const ADD_CATS = ["courses", "carburant", "autres", "tca"];
const SUBS = ["Mode", "Shopping", "Déco", "Appartement", "Cadeaux proches", "Restaurants", "Sorties & loisirs", "Beauté", "Santé", "Sport", "Animaux", "Voiture", "Voyages", "Divers"];
const TO_SORT = "À classer";
const TABS = [
  { id: "mois", label: "Mois", icon: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>' },
  { id: "depenses", label: "Dépenses", icon: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>' },
  { id: "camembert", label: "Camembert", icon: '<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M16 3.5A9 9 0 0 1 20.5 8H16z"/>' },
  { id: "evolution", label: "Évolution", icon: '<path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/>' }
];

/* ---------- Outils ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const euro = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const eur = c => euro.format((c || 0) / 100);
const eur0 = c => euro.format(Math.round((c || 0) / 100)).replace(/[,.]00/, "");
const pad = n => String(n).padStart(2, "0");
const now = () => new Date();
const todayISO = () => { const d = now(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const curMonth = () => todayISO().slice(0, 7);
const monthDate = m => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1);
const monthName = m => monthDate(m).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
const monthShort = m => monthDate(m).toLocaleDateString("fr-FR", { month: "short" }).replace(".", "");
const shiftMonth = (m, n) => { const d = monthDate(m); d.setMonth(d.getMonth() + n); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const daysIn = m => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
const dateLabel = d => d ? new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : "Sans date";
function parseMoney(v) {
  const s = String(v == null ? "" : v).replace(/\s/g, "").replace(/€/g, "").replace(",", ".");
  if (!s) return null;
  if (!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
  return Math.round(parseFloat(s) * 100);
}
const moneyInput = c => c == null ? "" : (c / 100).toFixed(2).replace(".", ",");
const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }

/* ---------- État et enregistrement ---------- */
const state = Object.assign({ expenses: {}, months: {} }, lsGet("budget.data", {}));
const ui = { tab: "mois", month: curMonth(), filter: "all", pieMode: "all", pieSel: null, evoCat: "all", evoRange: 12, evoSel: null, subRange: "month", subSel: null };
let db = null, mode = "loading", queue = lsGet("budget.q", []), flushing = false, stale = false;
const confirmed = { expenses: false, months: false };

function persist() { lsSet("budget.data", { expenses: state.expenses, months: state.months }); lsSet("budget.q", queue); }
function applyOp(o) { if (o.data) state[o.col][o.id] = o.data; else delete state[o.col][o.id]; }
function save(col, id, data) {
  const o = { col, id, data: data || null };
  applyOp(o);
  if (db) { queue = queue.filter(q => !(q.col === col && q.id === id)); queue.push(o); }
  persist(); render();
  if (db) flush();
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r({ code: "unavailable" }), ms))]);
async function flush() {
  if (!db || flushing) return;
  flushing = true;
  while (queue.length) {
    const o = queue[0];
    try {
      const ref = db.collection(o.col).doc(o.id);
      await withTimeout(o.data ? ref.set(o.data) : ref.delete(), 15000);
      if (queue[0] === o) queue.shift();
      lsSet("budget.q", queue);
    } catch (e) {
      const code = e && e.code;
      if (code === "invalid_argument" || code === "quota_exceeded" || code === "revoked") {
        queue.shift(); lsSet("budget.q", queue);
        toast("Enregistrement refusé. Vérifie que ta session est ouverte.");
        continue;
      }
      break; /* réseau : on réessaie plus tard, rien n'est perdu */
    }
  }
  flushing = false;
  renderNotice();
}
setInterval(() => { if (queue.length) flush(); }, 20000);
addEventListener("online", flush);

function onDocs(col, snap) {
  const map = {};
  snap.docs.forEach(d => { map[d.id] = d.data(); });
  const before = JSON.stringify(state[col]);
  state[col] = map;
  queue.filter(q => q.col === col).forEach(applyOp);
  if (!snap.metadata.fromCache) confirmed[col] = true;
  if (confirmed.expenses && confirmed.months) { stale = false; ensureCurrentMonth(); }

  fcat(v) { form.cat = v; renderCatPicker(); guessSub(); },
  fsugg(v) { $("f-label").value = v; guessSub(); },
  fsub(v) { form.sub = form.sub === v ? "" : v; $("f-subnew").value = ""; $("f-subnew").hidden = true; renderSubs(); },
  fsubnew() { form.sub = ""; renderSubs(); $("f-subnew").hidden = false; $("f-subnew").focus(); },
  subrange(v) { ui.subRange = v; ui.subSel = null; render(); },
  subsel(v) { ui.subSel = ui.subSel === v ? null : v; render(); },
  fdel() {
    const b = $("f-del");
    if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Confirmer la suppression"; return; }
    const id = form.id, old = state.expenses[id];
    save("expenses", id, null); closeSheet();
    toast("Dépense supprimée", () => save("expenses", id, old));
  },
  pdel(v) {
    const b = $("p-del");
    if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Confirmer la suppression"; return; }
    const old = state.months[v];
    save("months", v, null); closeSheet();
    toast("Mois supprimé", () => save("months", v, old));
  },
  logout() {
    if (queue.length) { closeSheet(); toast("Attends le réseau : des modifications ne sont pas encore envoyées."); return; }
    try { localStorage.removeItem("budget.data"); localStorage.removeItem("budget.q"); } catch (e) { /* stockage indisponible */ }
    BudgetBackend.logout();
  },
  scope(v) {
    setScope = v;
    document.querySelectorAll('[data-act="scope"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  },
  bump(v) {
    const [id, pct] = v.split(":"), c = parseMoney($(id).value);
    if (c) $(id).value = moneyInput(Math.round(c * (1 + pct / 100) / 100) * 100);
  },
  useavg(v) { const [id, c] = v.split(":"); $(id).value = moneyInput(Math.round(+c / 100) * 100); },
  rmrow(v, ev) { ev.target.closest(".formrow").remove(); },
  addrev() { const i = "n" + Date.now(); addRow("s-rev", rowsRevenue([{ id: uid("r"), label: "", cents: null }]).replace(/-0"/g, "-" + i + '"')); },
  addfix() { const i = "n" + Date.now(); addRow("s-fix", rowsFixed([{ id: uid("f"), label: "", cents: null, day: null }]).replace(/-0"/g, "-" + i + '"')); },
  undo() { if (toast.undo) toast.undo(); $("toast").innerHTML = ""; toast.undo = null; }
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const fn = actions[el.dataset.act]; if (fn) fn(el.dataset.v, ev);
});
document.addEventListener("change", ev => { if (ev.target.id === "f-label") guessSub(); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && $("sheet").innerHTML) closeSheet();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("svg [data-act]")) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});
document.addEventListener("submit", ev => {
  const fn = { "f-exp": submitExpense, "f-set": submitSettings, "f-past": submitPast }[ev.target.id];
  if (fn) { ev.preventDefault(); fn(); }
});
start();
</script>

</body>
